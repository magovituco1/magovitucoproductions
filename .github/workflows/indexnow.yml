name: IndexNow after Pages deployment
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public key and submit sitemap URLs
        env:
          INDEXNOW_KEY: 4f692f11971c41268bc9fc806329f1a1
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, json, urllib.request, urllib.error, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit
          host = 'www.magovituco.com'
          base = 'https://' + host + '/'
          key = os.environ['INDEXNOW_KEY']
          key_url = base + key + '.txt'
          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  if r.status != 200 or urlsplit(r.geturl()).netloc != host:
                      raise RuntimeError('Unexpected response: ' + url)
                  return r.read()
          if fetch(key_url).decode().strip() != key:
              raise RuntimeError('Public IndexNow key does not match')
          root = ET.fromstring(fetch(base + 'sitemap.xml'))
          urls = list(dict.fromkeys(x.text.strip() for x in root.findall('{http://www.sitemaps.org/schemas/sitemap/0.9}url/{http://www.sitemaps.org/schemas/sitemap/0.9}loc') if x.text))
          if not urls or any(urlsplit(u).netloc != host or urlsplit(u).scheme != 'https' for u in urls):
              raise RuntimeError('Unexpected sitemap URLs')
          payload = dict(host=host, key=key, keyLocation=key_url, urlList=urls)
          request = urllib.request.Request('https://api.indexnow.org/indexnow', data=json.dumps(payload).encode(), headers={'Content-Type':'application/json; charset=utf-8'}, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              print('IndexNow HTTP', response.status, '| URLs:', len(urls))
              if response.status not in (200, 202):
                  raise RuntimeError('Unexpected IndexNow status')
          PYCODE
